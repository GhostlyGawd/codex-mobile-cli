[containers]
# kreuzwerker/docker 4.5.0 does not expose HostConfig.PidsLimit. This is the
# dedicated workspace engine's creation-time default, so an omitted API field
# still becomes a real cgroup-v2 pids.max before the container can start.
# Template policy and the live Linux acceptance probe both require this exact
# value; zero/unlimited is never accepted.
pids_limit = 512
