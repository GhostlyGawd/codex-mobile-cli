[storage]
driver = "overlay"
runroot = "/run/codex-mobile-podman/storage"
graphroot = "/srv/codex-mobile/workspaces/.containers"

[storage.options]
# Make the rootful auto-userns allocator deterministic. The dedicated
# "containers" subordinate-ID pool is verified before the API is exposed.
root-auto-userns-user = "containers"
auto-userns-min-size = 1024
auto-userns-max-size = 65536

[storage.options.overlay]
mount_program = ""
ignore_chown_errors = "false"
# Fail-safe default for writable container overlays on the quota-capable XFS
# graphroot. The EnvBuilder Terraform resource repeats these options explicitly;
# plain workspaces are read-only.
size = "4G"
inodes = "262144"
