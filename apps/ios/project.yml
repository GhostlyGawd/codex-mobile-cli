name: CodexMobile

options:
  minimumXcodeGenVersion: 2.45.4
  xcodeVersion: "26.6"
  projectFormat: xcode16_3
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  developmentLanguage: en

configs:
  Debug: debug
  Release: release

configFiles:
  Debug: Config/Debug.xcconfig
  Release: Config/Release.xcconfig

packages:
  SwiftOpenAPIGenerator:
    url: https://github.com/apple/swift-openapi-generator.git
    exactVersion: 1.11.1
  OpenAPIRuntime:
    url: https://github.com/apple/swift-openapi-runtime.git
    exactVersion: 1.11.0
  SwiftTerm:
    url: https://github.com/migueldeicaza/SwiftTerm.git
    exactVersion: 1.14.0
  Runestone:
    url: https://github.com/simonbs/Runestone.git
    exactVersion: 0.5.2
  TreeSitterLanguages:
    url: https://github.com/simonbs/TreeSitterLanguages.git
    exactVersion: 0.1.10

settings:
  base:
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    CLANG_ENABLE_MODULES: YES
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    GCC_C_LANGUAGE_STANDARD: gnu17
    LOCALIZATION_PREFERS_STRING_CATALOGS: YES

targets:
  CodexMobile:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Sources
      - path: Resources/Assets.xcassets
    dependencies:
      - package: OpenAPIRuntime
      - package: SwiftTerm
      - package: Runestone
      - package: TreeSitterLanguages
        product: TreeSitterBashRunestone
      - package: TreeSitterLanguages
        product: TreeSitterCSSRunestone
      - package: TreeSitterLanguages
        product: TreeSitterGoRunestone
      - package: TreeSitterLanguages
        product: TreeSitterHTMLRunestone
      - package: TreeSitterLanguages
        product: TreeSitterJavaScriptRunestone
      - package: TreeSitterLanguages
        product: TreeSitterJSONRunestone
      - package: TreeSitterLanguages
        product: TreeSitterMarkdownRunestone
      - package: TreeSitterLanguages
        product: TreeSitterPythonRunestone
      - package: TreeSitterLanguages
        product: TreeSitterSwiftRunestone
      - package: TreeSitterLanguages
        product: TreeSitterTOMLRunestone
      - package: TreeSitterLanguages
        product: TreeSitterTSXRunestone
      - package: TreeSitterLanguages
        product: TreeSitterTypeScriptRunestone
      - package: TreeSitterLanguages
        product: TreeSitterYAMLRunestone
    buildToolPlugins:
      - plugin: OpenAPIGenerator
        package: SwiftOpenAPIGenerator
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(IOS_BUNDLE_ID)
        PRODUCT_NAME: CodexMobile
        PRODUCT_MODULE_NAME: CodexMobile
        DEVELOPMENT_TEAM: $(APPLE_TEAM_ID)
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_ENTITLEMENTS: Resources/CodexMobile.entitlements
        TARGETED_DEVICE_FAMILY: "1,2"
        SUPPORTS_MACCATALYST: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        CURRENT_PROJECT_VERSION: 1
        MARKETING_VERSION: 0.1.0
    info:
      path: Resources/Info.plist
      properties:
        CFBundleDisplayName: $(APP_DISPLAY_NAME)
        CFBundleDevelopmentRegion: en
        APIBaseURL: $(API_BASE_URL)
        PasskeyRelyingPartyIdentifier: $(PASSKEY_RP_ID)
        PreviewAllowedHostSuffix: $(PREVIEW_HOST_SUFFIX)
        ITSAppUsesNonExemptEncryption: false
        UIApplicationSupportsIndirectInputEvents: true
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
    scheme:
      testTargets:
        - CodexMobileTests
        - CodexMobileUITests
      gatherCoverageData: true

  CodexMobileTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Tests
    dependencies:
      - target: CodexMobile
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(IOS_BUNDLE_ID).tests
        GENERATE_INFOPLIST_FILE: YES

  CodexMobileUITests:
    type: bundle.ui-testing
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: UITests
    dependencies:
      - target: CodexMobile
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(IOS_BUNDLE_ID).uitests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: CodexMobile
