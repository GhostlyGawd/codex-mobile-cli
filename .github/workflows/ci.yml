name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Standard GitHub-hosted runners are free only while this repository is public.
# Every runner job therefore fails closed before runner allocation unless both
# the event reports a public repository and the owner has explicitly enabled
# public CI. See docs/runbooks/CI.md.
jobs:
  backend-and-policy:
    if: ${{ github.event.repository.private == false && vars.PUBLIC_CI_ENABLED == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      GOTOOLCHAIN: local
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Install pinned Go
        uses: actions/setup-go@0a12ed9d6a96ab950c8f026ed9f722fe0da7ef32 # v5.0.2
        with:
          go-version: 1.26.5
          cache: false

      - name: Install the only Python test dependency
        run: python3 -m pip install --disable-pip-version-check --no-input PyYAML==6.0.3

      - name: Rebuild and verify the pinned EnvBuilder source derivative
        run: python3 -I ./scripts/verify-envbuilder-source.py

      - name: Synchronize workspace and verify generated dependency files
        run: |
          go work sync
          git diff --exit-code -- go.work.sum services/control-plane/go.mod services/control-plane/go.sum

      - name: Verify Go formatting
        run: |
          go -C services/control-plane fmt ./...
          git diff --exit-code -- services/control-plane

      - name: Vet backend
        run: go vet ./services/control-plane/...

      - name: Race-test backend
        run: go test -race ./services/control-plane/...

      - name: Test backend with coverage
        run: |
          mkdir -p coverage
          go test ./services/control-plane/... -coverprofile=coverage/control-plane.out

      - name: Verify infrastructure and billing policy
        run: sh ./infra/tests/run-static-tests.sh

      - name: Verify native-client source policy without claiming an Xcode build
        run: bash ./scripts/test-ios-static.sh

      - name: Verify tracked supply-chain reports are current
        run: |
          python3 ./scripts/generate-supply-chain.py --check
          python3 ./scripts/validate-release-artifacts.py
